<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<svg th:fragment="icon(name)" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <th:block th:switch="${name}">
        <th:block th:case="'dashboard'">
            <rect width="7" height="9" x="3" y="3" rx="1"/>
            <rect width="7" height="5" x="14" y="3" rx="1"/>
            <rect width="7" height="9" x="14" y="12" rx="1"/>
            <rect width="7" height="5" x="3" y="16" rx="1"/>
        </th:block>
        <th:block th:case="'members'">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </th:block>
        <th:block th:case="'memberships'">
            <path d="M20 7h-9M14 17H5M17 3l4 4-4 4M8 21l-4-4 4-4"/>
        </th:block>
        <th:block th:case="'plans'">
            <path d="M20.59 13.41 11 3.83V3H4v7h.83l9.58 9.59a2 2 0 0 0 2.82 0l3.36-3.36a2 2 0 0 0 0-2.82Z"/>
            <circle cx="7.5" cy="6.5" r=".5" fill="currentColor"/>
        </th:block>
        <th:block th:case="'payments'">
            <rect width="20" height="14" x="2" y="5" rx="2"/>
            <line x1="2" x2="22" y1="10" y2="10"/>
        </th:block>
        <th:block th:case="'checkins'">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </th:block>
        <th:block th:case="'workouts'">
            <path d="M6.5 6.5h11v11h-11zM3 9v6M21 9v6M6.5 12H3M21 12h-3.5"/>
        </th:block>
        <th:block th:case="'assessments'">
            <path d="M9 11l3 3L22 4"/>
            <path d="M19 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>
        </th:block>
        <th:block th:case="'reports'">
            <path d="M3 3v18h18"/>
            <path d="m7 16 4-5 4 3 5-7"/>
        </th:block>
        <th:block th:case="'plus'">
            <path d="M12 5v14M5 12h14"/>
        </th:block>
        <th:block th:case="'search'">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
        </th:block>
        <th:block th:case="'bell'">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
        </th:block>
        <th:block th:case="'menu'">
            <path d="M4 6h16M4 12h16M4 18h16"/>
        </th:block>
        <th:block th:case="'arrow'">
            <path d="m9 18 6-6-6-6"/>
        </th:block>
        <th:block th:case="'edit'">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </th:block>
        <th:block th:case="'logout'">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="m16 17 5-5-5-5M21 12H9"/>
        </th:block>
        <th:block th:case="'calendar'">
            <rect width="18" height="18" x="3" y="4" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
        </th:block>
        <th:block th:case="'user'">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21a8 8 0 0 1 16 0"/>
        </th:block>
        <th:block th:case="'money'">
            <circle cx="12" cy="12" r="9"/>
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 6v12"/>
        </th:block>
        <th:block th:case="'clock'">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
        </th:block>
        <th:block th:case="'alert'">
            <path d="M10.3 2.9 1.8 17a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 2.9a2 2 0 0 0-3.4 0Z"/>
            <path d="M12 9v4M12 17h.01"/>
        </th:block>
        <th:block th:case="'trash'">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/>
        </th:block>
        <th:block th:case="*">
            <circle cx="12" cy="12" r="9"/>
        </th:block>
    </th:block>
</svg>
</body>
</html>
