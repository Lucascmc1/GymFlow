<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Treinos', 'workouts', ~{::main})}">
<main>
    <header class="page-header">
        <div>
            <span class="eyebrow">Prescrição</span>
            <h1>Treinos</h1>
            <p>Crie fichas objetivas e mantenha a evolução dos alunos organizada.</p>
        </div>
        <div class="page-actions">
            <a th:href="@{/workouts/new}" class="button button-primary">
                <svg th:replace="~{fragments/icons :: icon('plus')}"></svg>
                Novo treino
            </a>
        </div>
    </header>

    <section class="workout-grid" th:if="${!workouts.empty}">
        <article class="card workout-card" th:each="workout : ${workouts}">
            <div class="workout-card-top">
                <span class="kpi-icon"><svg th:replace="~{fragments/icons :: icon('workouts')}"></svg></span>
                <span class="status" th:classappend="${workout.active} ? 'status-active' : 'status-inactive'"
                      th:text="${workout.active} ? 'Ativo' : 'Arquivado'">Ativo</span>
            </div>
            <h2 th:text="${workout.title}">Treino A · Força</h2>
            <p th:text="${workout.goal}">Ganho de força e massa muscular</p>
            <div class="workout-meta">
                <span th:text="|Aluno: ${workout.member.name}|">Aluno: Marina</span>
                <span th:text="|Prof.: ${workout.coach}|">Prof.: Carlos</span>
            </div>
            <a th:href="@{/workouts/{id}(id=${workout.id})}" class="button button-secondary button-block">Abrir ficha</a>
        </article>
    </section>
    <section class="card empty-state" th:if="${workouts.empty}"><p><strong>Nenhum treino cadastrado</strong>Crie a primeira ficha de exercícios.</p></section>
</main>
</html>
